[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-pyai"
version = "0.1.4"
description = "PyAI (Hear speech-to-text + Speak text-to-speech) services for Pipecat."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PyAI" }]
keywords = ["pipecat", "voice", "agents", "stt", "tts", "pyai"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pipecat-ai>=1.14.0,<2.0",
    "aiohttp>=3.11.12,<4.0",
    "websockets>=13.1,<18.0",
    "loguru>=0.7.3,<1.0",
    "pyai-sdk>=0.1.0,<1.0",
]

[project.urls]
Homepage = "https://pyai.com"
Documentation = "https://pyai.com/compare/pipecat"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipecat_pyai*"]

[tool.setuptools.package-data]
pipecat_pyai = ["py.typed"]
