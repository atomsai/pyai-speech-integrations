[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livekit-plugins-pyai"
version = "0.1.2"
description = "PyAI (Hear speech-to-text + Speak text-to-speech) plugin for LiveKit Agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PyAI" }]
keywords = ["livekit", "webrtc", "voice", "agents", "stt", "tts", "pyai"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "livekit-agents>=1.6.10,<2.0",
    "aiohttp>=3.10.0,<4.0",
    "pyai-sdk>=0.1.0,<1.0",
]

[project.optional-dependencies]
examples = [
    "livekit-plugins-openai>=1.6.10,<2.0",
    "livekit-plugins-silero>=1.6.10,<2.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.urls]
Homepage = "https://pyai.com"
Documentation = "https://pyai.com/compare/livekit"

[tool.setuptools.packages.find]
where = ["."]
include = ["livekit.plugins.pyai*"]
namespaces = true

[tool.setuptools.package-data]
"livekit.plugins.pyai" = ["py.typed"]
